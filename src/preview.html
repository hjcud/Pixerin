<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <title>Pixel Mat, 실제 크기</title>
    <link rel="stylesheet" href="preview.css" />
    <link rel="stylesheet" href="themes.css" />
    <link rel="stylesheet" href="icons.css" />
  </head>
  <body>
    <header>
      <strong>실제 크기 미리보기</strong
      ><select id="background" aria-label="미리보기 배경">
        <option value="checker">투명 격자</option>
        <option value="light">밝은 배경</option>
        <option value="dark">어두운 배경</option>
      </select>
    </header>
    <p id="status" role="status">캔버스 연결 중</p>
    <main id="previews" class="checker">
      <figure>
        <canvas id="preview-1"></canvas>
        <figcaption>1×</figcaption>
      </figure>
      <figure>
        <canvas id="preview-2"></canvas>
        <figcaption>2×</figcaption>
      </figure>
      <figure>
        <canvas id="preview-4"></canvas>
        <figcaption>4×</figcaption>
      </figure>
    </main>
    <script type="module" src="preview.mjs"></script>
  </body>
</html>
